server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:

  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: varlogs
          __path__: /var/log/*log

  - job_name: 'elevar-cms-logs'
    static_configs:
      - targets:
          - localhost
        labels:
          job: 'elevar-cms'
          __path__: C:/Users/neils/Documents/projects/elevar/elevar-cms/logs/*.log